name: Test Email Step

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Restore Gmail token from secret
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: printf '%s' "$GMAIL_TOKEN_JSON" > automation/gmail_token.json

      - name: Create test email meta
        run: |
          cat > automation/_email_meta.json << 'EOF'
          {
            "slug": "aug12-2026",
            "date_long": "Wednesday, August 12, 2026",
            "subject": "OIL DESK — Daily Briefing | Wednesday, August 12, 2026",
            "body": "Brent extended its six-day winning streak to ~$89.45 (+0.63%), knocking on $90 resistance after the EIA reported a 1.7M-barrel crude draw reversing last week's surprise build. Iran published a restrictive Hormuz navigation draft requiring ships to seek Iranian permission — markets read it as a hardening signal. Trump added a reparations demand to the mix. Price call: $88–$92, testing $90, bias higher."
          }
          EOF

      - name: Email the briefing
        run: |
          SLUG=$(python3 -c "import json;print(json.load(open('automation/_email_meta.json'))['slug'])")
          SUBJECT=$(python3 -c "import json;print(json.load(open('automation/_email_meta.json'))['subject'])")
          BODY=$(python3 -c "import json;print(json.load(open('automation/_email_meta.json'))['body'])")
          DATE_LONG=$(python3 -c "import json;print(json.load(open('automation/_email_meta.json'))['date_long'])")
          URL="https://hakanzw.github.io/oil-desk-briefings/oil-market-briefing-${SLUG}.html"
          python3 automation/send_email.py --url "$URL" --subject "$SUBJECT" --body "$BODY" --date-long "$DATE_LONG"
